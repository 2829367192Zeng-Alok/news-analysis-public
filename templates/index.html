<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>金融新闻分析系统</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="top-bar">
    <div class="brand">金融新闻分析</div>
    <div class="stats" id="stats">加载统计...</div>
  </header>

  <main class="layout">
    <section class="news-list">
      <h2>最新新闻</h2>
      <div id="news-list-container" class="news-list-container">
        加载中...
      </div>
    </section>

    <section class="news-detail">
      <h2>分析详情</h2>
      <div id="detail-container" class="detail-container">
        请选择左侧一条新闻查看详细分析。
      </div>
    </section>
  </main>

  <script src="/static/js/main.js"></script>
</body>
</html>
