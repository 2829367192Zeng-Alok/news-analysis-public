[project]
name = "financial-news-analysis"
version = "0.1.0"
description = "金融新闻采集-筛选-分析-展示系统（黄金宏观）"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E9/F63/F7/F82 为致命级：语法/错误名称/未定义名称，修复前不允许合入
select = ["E9", "F63", "F7", "F82", "F401", "F811"]
ignore = []
